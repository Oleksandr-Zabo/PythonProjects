{% extends 'base.html' %}

{% block title %}Видалення книги{% endblock %}

{% block content %}
    <h1>Видалення книги</h1>
    <p>Ви впевнені, що хочете видалити книгу "{{ object.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Так, видалити</button>
        <a href="{% url 'book_list' %}">Скасувати</a>
    </form>
{% endblock %}
